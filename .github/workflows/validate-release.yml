name: Validate public release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate public boundary and payload
        run: python scripts/validate_release.py

      - name: Build deterministic Hugging Face package
        run: |
          python scripts/build_hf_release_package.py \
            --source-commit "${GITHUB_SHA}" \
            --output-dir "${RUNNER_TEMP}/bio-constitution-rules-hf"
